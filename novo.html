<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Subaquático</title>
  <style>
    /* --- Reset e Fontes --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      overflow: hidden; /* Impede barras de rolagem para manter o efeito imersivo */
      color: #ffffff;
    }

    /* --- Vídeo de Fundo --- */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -2;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    /* Overlay escuro para dar contraste ao texto */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 20, 40, 0.4);
      z-index: -1;
    }

    /* --- Conteúdo da Landing Page --- */
    .content {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .content h1 {
      font-size: 3.5rem;
      margin-bottom: 20px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
    }

    .content p {
      font-size: 1.25rem;
      max-width: 600px;
      margin-bottom: 30px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
      line-height: 1.6;
    }

    .btn-cta {
      display: inline-block;
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #00334e;
      background-color: #00f2fe;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
      transition: all 0.3s ease;
    }

    .btn-cta:hover {
      background-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
      transform: translateY(-3px);
    }

    /* --- Animação de Bolhas CSS --- */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none; /* Permite clicar nos elementos atrás das bolhas */
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
      animation: rise 10s infinite ease-in;
    }

    /* Animação que faz a bolha subir e oscilar para os lados */
    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      50% {
        transform: translateY(-50vh) translateX(50px);
      }
      100% {
        transform: translateY(-105vh) translateX(-30px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Vídeo de Fundo (Substitua a URL do 'src' pelo seu próprio arquivo .mp4 se preferir) -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-underwater-lights-and-fish-4152-large.mp4" type="video/mp4" />
    Seu navegador não suporta vídeos em HTML5.
  </video>

  <!-- Camada de sobreposição para melhorar o contraste -->
  <div class="overlay"></div>

  <!-- Contêiner das Bolhas Animadas -->
  <div class="bubbles-container" id="bubbles"></div>

  <!-- Conteúdo Principal -->
  <main class="content">
    <h1>Sinta a Tranquilidade do Oceano</h1>
    <p>Explore as maravilhas da vida marinha com uma experiência totalmente imersiva. Deixe-se levar pela serenidade do fundo do mar.</p>
    <a href="#" class="btn-cta">Saiba Mais</a>
  </main>

  <!-- Script para gerar bolhas com tamanhos e tempos variados -->
  <script>
    const bubblesContainer = document.getElementById('bubbles');
    const numberOfBubbles = 30; // Quantidade de bolhas na tela

    for (let i = 0; i < numberOfBubbles; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      // Tamanho aleatório entre 10px e 50px
      const size = Math.random() * 40 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;

      // Posição horizontal aleatória (0% a 100%)
      bubble.style.left = `${Math.random() * 100}%`;

      // Duração da animação aleatória (entre 5s e 15s)
      const duration = Math.random() * 10 + 5;
      bubble.style.animationDuration = `${duration}s`;

      // Atraso de início aleatório para não subirem todas juntas
      const delay = Math.random() * 10;
      bubble.style.animationDelay = `${delay}s`;

      bubblesContainer.appendChild(bubble);
    }
  </script>
</body>
</html>
